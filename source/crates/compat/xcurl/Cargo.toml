[package]
name = "xcurl"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the Xbox GDK XCurl.dll: the libcurl easy/multi/slist/url API implemented on WinHTTP, so every transfer passes through the compat-common network guard."
license = "MIT OR Apache-2.0"

[lib]
name = "xcurl"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[dev-dependencies]
serde_json = "1.0.154"
