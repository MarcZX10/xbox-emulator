[package]
name = "kernel32"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console System32\\forwarders\\kernel32.dll exports a PC kernel32 lacks: PE forwarders to the identical KernelBase / ntdll functions the console forwarders resolve to."
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "kernel32"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
