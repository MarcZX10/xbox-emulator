[package]
name = "mflnmhelp"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console mflnmhelp.dll: the Win32 helper shims Media Foundation uses on the console, ported from the console bodies."
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "mflnmhelp"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }
