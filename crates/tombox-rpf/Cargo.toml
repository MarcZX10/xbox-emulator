[package]
name = "tombox-rpf"
version = "0.1.0"
edition = "2021"
description = "Inspector for RAGE package files (.rpf): header fields and region map. Reads structure only; does not decrypt. Zero dependencies."
license = "MIT OR Apache-2.0"

[lib]
name = "tombox_rpf"
path = "src/lib.rs"

[[bin]]
name = "rpf-inspect"
path = "src/bin/rpf-inspect.rs"

[dependencies]
# None: parses untrusted input; stays auditable.
