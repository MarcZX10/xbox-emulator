[package]
name = "shcore"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console SHCore.dll ordinal exports a PC SHCore lacks."
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "shcore"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
