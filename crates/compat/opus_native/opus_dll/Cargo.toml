[package]
name = "opus_dll"
version = "0.1.0"
edition = "2021"
description = "opus.dll for the AudioHALWrapper compat layer: libopus (third_party/opus 316c675fa1c9, fixed point, generic C) with the public opus_* C API exported."
license = "BSD-3-Clause"
build = "build.rs"

[lib]
name = "opus"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
