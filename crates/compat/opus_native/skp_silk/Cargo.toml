[package]
name = "skp_silk"
version = "0.1.0"
edition = "2021"
description = "SKP_SILK_SDK.dll for the AudioHALWrapper compat layer: the Skype SILK SDK C API (SKP_Silk_SDK_*) implemented on the SILK codec inside libopus (third_party/opus 316c675fa1c9)."
license = "BSD-3-Clause"
build = "build.rs"

[lib]
name = "SKP_SILK_SDK"
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
