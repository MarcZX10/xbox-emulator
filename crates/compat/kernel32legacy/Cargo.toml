[package]
name = "kernel32legacy"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the Xbox console kernel32legacy.dll: 303 exports with the console ordinals; PE forwarders to the host kernel32/kernelbase/ntdll where the console code is the same, the os_host affinity and DLL-directory emulation for the hooked rows, and a console-exact GetNumaNodeProcessorMask."
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "kernel32legacy"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
