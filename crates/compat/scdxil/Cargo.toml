[package]
name = "scdxil"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the Xbox scdxil.dll shader-compiler DXIL front end: DXIL program/container queries reimplemented, DXC factory mapped onto the runtime dxcompiler_xs."
license = "MIT OR Apache-2.0"

[lib]
name = "scdxil"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
dxcompiler_xs = { path = "../dxcompiler_xs" }

[dev-dependencies]
miniz_oxide = "0.8"
