[package]
name = "advapi32legacy"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console advapi32legacy.dll: PE forwarders to the identical PC advapi32 (staged beside it as advapi32_sys.dll, so nothing binds back to the compat advapi32.dll) and KernelBase functions, and the console-only Elf* event-log NTSTATUS entry points implemented from the console disassembly."
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
name = "advapi32legacy"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
xone-exports = { path = "../xone-exports" }
