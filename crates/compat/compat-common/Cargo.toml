[package]
name = "compat-common"
version = "0.1.0"
edition = "2021"
description = "Shared call-logging for TomBox Xbox compat stub/shim DLLs."
license = "MIT OR Apache-2.0"

[lib]
name = "compat_common"
path = "src/lib.rs"

[dependencies]
# Relocates displaced prologue instructions when hooking network entry points (net_guard).
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info"] }
serde_json = "1.0.154"
