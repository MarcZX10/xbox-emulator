[package]
name = "xpal"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for Xbox xpal.dll: platform abstraction layer over an emulated console hypervisor, XConfig store and XVmCtrl host device."
license = "MIT OR Apache-2.0"

[lib]
name = "xpal"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
compat-common = { path = "../compat-common" }
